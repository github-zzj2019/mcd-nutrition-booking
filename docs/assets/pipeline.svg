<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 296" width="680" height="296" role="img" aria-label="端到端管线：一句话输入经六步编排，融合五维约束求解，输出一张可确认的方案卡片">
  <defs>
    <marker id="pg" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8C959F"/>
    </marker>
    <marker id="pr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#DA291C"/>
    </marker>
    <style>
      .t{font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif}
      .h{font-size:18px;font-weight:700;fill:#1F2328}
      .s{font-size:12px;fill:#57606A}
      .b{font-size:12.5px;font-weight:700;fill:#1F2328}
      .n{font-size:11px;fill:#57606A}
      .c{font-size:11px;font-weight:700}
    </style>
  </defs>

  <rect width="680" height="296" fill="#FFFFFF"/>

  <text class="t h" x="24" y="28">一句话进，一张卡出</text>
  <text class="t s" x="24" y="48">每个环节都由麦当劳 MCP 的真实能力驱动，六步之间有真实的因果依赖</text>

  <!-- 输入 -->
  <rect x="24" y="62" width="632" height="30" rx="6" fill="#FFF3F2" stroke="#DA291C" stroke-width="1.3"/>
  <text class="t n" x="38" y="81" fill="#B31F16">💬「明天中午我和两个同事吃饭，我在控钠，小王增肌蛋白 40g 以上，小李随便，预算 120」</text>

  <!-- ===== 行 1 ===== -->
  <rect x="24" y="106" width="200" height="60" rx="7" fill="#FFFFFF" stroke="#C9CFD6" stroke-width="1.2"/>
  <text class="t b" x="38" y="126">① 解析意图</text>
  <text class="t n" x="38" y="144">时间 · 人数 · 各自营养目标</text>
  <text class="t n" x="38" y="159">预算 · 反向 / 多日 / 跨店</text>

  <rect x="240" y="106" width="200" height="60" rx="7" fill="#FFFFFF" stroke="#C9CFD6" stroke-width="1.2"/>
  <text class="t b" x="254" y="126">② 门店与餐段</text>
  <text class="t n" x="254" y="144">可约时段 · 营业起止</text>
  <text class="t n" x="254" y="159">换餐空档检测（实测 29 min）</text>

  <rect x="456" y="106" width="200" height="60" rx="7" fill="#FFFFFF" stroke="#C9CFD6" stroke-width="1.2"/>
  <text class="t b" x="470" y="126">③ 按时段取菜单</text>
  <text class="t n" x="470" y="144">传 reservationDate 拉取</text>
  <text class="t n" x="470" y="159">该时段实时可售菜品</text>

  <path d="M224,136 L236,136" stroke="#8C959F" stroke-width="1.6" fill="none" marker-end="url(#pg)"/>
  <path d="M440,136 L452,136" stroke="#8C959F" stroke-width="1.6" fill="none" marker-end="url(#pg)"/>
  <path d="M556,166 L556,178 L156,178 L156,170" stroke="#8C959F" stroke-width="1.6" fill="none" marker-end="url(#pg)"/>

  <!-- ===== 行 2 ===== -->
  <rect x="24" y="182" width="200" height="60" rx="7" fill="#FFFFFF" stroke="#C9CFD6" stroke-width="1.2"/>
  <text class="t b" x="38" y="202">④ 拆套餐 · 累加营养</text>
  <text class="t n" x="38" y="220">菜单是套餐，营养表是单品</text>
  <text class="t n" x="38" y="235">拆 rounds → 逐项匹配 → 累加</text>

  <rect x="240" y="182" width="200" height="60" rx="7" fill="#FFF3F2" stroke="#DA291C" stroke-width="1.6"/>
  <text class="t b" x="254" y="202" fill="#B31F16">⑤ 约束求解 · 排序</text>
  <text class="t n" x="254" y="220">硬约束过滤 + 软目标打分</text>
  <text class="t n" x="254" y="235">单人 / 多人求交 / 反向推荐</text>

  <rect x="456" y="182" width="200" height="60" rx="7" fill="#FFFFFF" stroke="#C9CFD6" stroke-width="1.2"/>
  <text class="t b" x="470" y="202">⑥ 券与活动</text>
  <text class="t n" x="470" y="220">按 productCode 精确匹配</text>
  <text class="t n" x="470" y="235">活动 × 预约时段 单行提示</text>

  <path d="M224,212 L236,212" stroke="#8C959F" stroke-width="1.6" fill="none" marker-end="url(#pg)"/>
  <path d="M440,212 L452,212" stroke="#8C959F" stroke-width="1.6" fill="none" marker-end="url(#pg)"/>

  <!-- 输出 -->
  <path d="M556,242 L556,254 L340,254 L340,262" stroke="#DA291C" stroke-width="2" fill="none" marker-end="url(#pr)"/>
  <rect x="24" y="262" width="632" height="26" rx="6" fill="#FFC72C" stroke="#E0A800" stroke-width="1.2"/>
  <text class="t c" x="38" y="280" fill="#5A3E00">📋 方案卡片：组合 · 营养核算 · 达成度 · 券后价 · 活动提示 · 「为什么选这个时间」　→　确认后 create-order（绝不自动下单）</text>
</svg>
