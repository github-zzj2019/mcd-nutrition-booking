<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-label="时间与营养的双向约束：餐段决定菜单，菜单决定营养可行域；反过来营养目标可以反推最优餐段">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#DA291C"/>
    </marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1F2328"/>
    </marker>
    <style>
      .t{font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif}
      .h{font-size:19px;font-weight:700;fill:#1F2328}
      .s{font-size:12.5px;fill:#57606A}
      .b{font-size:12px;font-weight:700}
      .n{font-size:11px;fill:#1F2328}
      .m{font-size:11px;fill:#57606A}
    </style>
  </defs>

  <rect width="680" height="400" fill="#FFFFFF"/>

  <!-- ===== 标题 ===== -->
  <text class="t h" x="24" y="30">时间与营养，是同一个问题的两面</text>
  <text class="t s" x="24" y="50">麦当劳按餐段切换厨房与菜单 —— 所以「约几点」直接决定「能吃到什么营养」</text>

  <!-- ===== 时间轴（真实比例：全店 06:14–21:45，共 931 分钟映射到 600px）===== -->
  <rect x="40" y="86" width="155" height="26" rx="5" fill="#FFC72C" stroke="#E0A800" stroke-width="1"/>
  <text class="t b" x="117" y="103" text-anchor="middle" fill="#5A3E00">早餐 06:14–10:15</text>

  <rect x="195" y="86" width="19" height="26" rx="4" fill="#EDEFF2" stroke="#C9CFD6" stroke-width="1" stroke-dasharray="3 2"/>
  <rect x="214" y="86" width="136" height="26" rx="5" fill="#DA291C" stroke="#B31F16" stroke-width="1"/>
  <text class="t b" x="282" y="103" text-anchor="middle" fill="#FFFFFF">午餐 10:44–14:15</text>

  <rect x="350" y="86" width="19" height="26" rx="4" fill="#EDEFF2" stroke="#C9CFD6" stroke-width="1" stroke-dasharray="3 2"/>
  <rect x="369" y="86" width="78" height="26" rx="5" fill="#FFC72C" stroke="#E0A800" stroke-width="1"/>
  <text class="t b" x="408" y="103" text-anchor="middle" fill="#5A3E00">下午茶</text>

  <rect x="447" y="86" width="19" height="26" rx="4" fill="#EDEFF2" stroke="#C9CFD6" stroke-width="1" stroke-dasharray="3 2"/>
  <rect x="466" y="86" width="175" height="26" rx="5" fill="#5C2E91" stroke="#431F6B" stroke-width="1"/>
  <text class="t b" x="553" y="103" text-anchor="middle" fill="#FFFFFF">夜市 17:14–21:45</text>

  <text class="t m" x="204" y="127" text-anchor="middle">空档</text>
  <text class="t m" x="359" y="127" text-anchor="middle">空档</text>
  <text class="t m" x="456" y="127" text-anchor="middle">空档</text>

  <!-- ===== 两套互不相交的菜单 ===== -->
  <!-- 早餐菜单盒 -->
  <rect x="40" y="140" width="290" height="86" rx="8" fill="#FFFBEA" stroke="#E0A800" stroke-width="1.5"/>
  <text class="t b" x="56" y="161" fill="#5A3E00">早餐菜单（实测 08:00 返回）</text>
  <text class="t n" x="56" y="181">双层猪柳蛋麦满分 · 猪柳炒双蛋堡 · 薯饼 · 厚松饼堡</text>
  <text class="t n" x="56" y="199">早安营养卷 · 鲜萃冰咖 · 纯牛奶</text>
  <text class="t m" x="56" y="216">巨无霸、麦辣鸡腿堡 —— 完全不在返回列表里</text>

  <!-- 正餐菜单盒 -->
  <rect x="350" y="140" width="291" height="86" rx="8" fill="#FFF3F2" stroke="#DA291C" stroke-width="1.5"/>
  <text class="t b" x="366" y="161" fill="#B31F16">正餐菜单（实测 12:00 返回）</text>
  <text class="t n" x="366" y="181">巨无霸 · 麦香鸡 · 麦香鱼 · 板烧鸡腿堡</text>
  <text class="t n" x="366" y="199">培根蔬萃双层牛堡 · 中薯条 · 无糖可乐</text>
  <text class="t m" x="366" y="216">麦满分、薯饼 —— 完全不在返回列表里</text>

  <!-- ===== 正向：时间决定营养可行域 ===== -->
  <path d="M117,112 L117,136" stroke="#1F2328" stroke-width="1.6" fill="none" marker-end="url(#ab)"/>
  <path d="M282,112 L282,136" stroke="#1F2328" stroke-width="1.6" fill="none" marker-end="url(#ab)"/>
  <text class="t m" x="117" y="132" text-anchor="middle">↓ 决定</text>
  <text class="t m" x="282" y="132" text-anchor="middle">↓ 决定</text>

  <!-- ===== 反向：营养目标反推餐段 ===== -->
  <rect x="24" y="264" width="632" height="112" rx="9" fill="#F6F8FA" stroke="#C9CFD6" stroke-width="1.2"/>
  <text class="t b" x="40" y="287" fill="#1F2328">反向求解：先给营养目标，反推「该约几点」</text>

  <!-- 输入 -->
  <rect x="40" y="300" width="180" height="56" rx="7" fill="#FFFFFF" stroke="#DA291C" stroke-width="1.6"/>
  <text class="t n" x="52" y="320">🎯 蛋白质 ≥ 25 g</text>
  <text class="t n" x="52" y="338">🎯 能量 ≤ 600 kcal</text>
  <text class="t n" x="52" y="352">🎯 钠 ≤ 800 mg</text>

  <!-- 箭头 -->
  <path d="M226,328 L296,328" stroke="#DA291C" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text class="t m" x="261" y="319" text-anchor="middle">遍历</text>
  <text class="t m" x="261" y="346" text-anchor="middle">各餐段</text>

  <!-- 输出 -->
  <rect x="302" y="300" width="172" height="56" rx="7" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.2"/>
  <text class="t m" x="314" y="318">① 早餐 06:14　评分 3.00</text>
  <text class="t m" x="314" y="336">② 午餐 10:44　评分 2.96</text>
  <text class="t m" x="314" y="352">③ 下午茶 14:44　评分 2.96</text>

  <!-- 结论 -->
  <path d="M480,328 L520,328" stroke="#DA291C" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="526" y="298" width="118" height="60" rx="7" fill="#FFC72C" stroke="#E0A800" stroke-width="1.4"/>
  <text class="t b" x="585" y="318" text-anchor="middle" fill="#5A3E00">建议约 06:14</text>
  <text class="t n" x="585" y="339" text-anchor="middle">猪柳炒双蛋堡</text>
  <text class="t m" x="585" y="353" text-anchor="middle">三项目标全达成</text>

  <text class="t m" x="24" y="392">数据来自麦当劳 MCP 实测（门店：北京朝外餐厅，日期 2026-10-12）。空档为厨房切换窗口，实测约 29 分钟，此时段不可下单。</text>
</svg>
